# =====================================================================
#  Infra Ops · Centro de observabilidad en https://monitoreo.empresa.com/estado/
#  Incluir DENTRO del bloque `server { listen 443 ... }` de monitoreo.empresa.com:
#
#     include /etc/nginx/snippets/infra-estado.conf;
#
#  Protegido con la sesión de Grafana: sin sesión → redirige a /login.
#  Validar y recargar:  sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

location = /estado/_auth {
    internal;
    proxy_pass http://127.0.0.1:3001/api/user;     # Grafana (contenedor publicado en 127.0.0.1:3001)
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
}
location @estado_login { return 302 /login; }
location = /estado { return 301 /estado/; }

location /estado/ {
    auth_request /estado/_auth;
    error_page 401 = @estado_login;

    proxy_pass http://127.0.0.1:4000/;               # backend Node (quita el prefijo /estado/)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Frame-Options SAMEORIGIN always;
}
